const tasks=[["LCDC", 37.541, 127.0613, "玩家选“线条/材质/色彩”线索→观察开放区域真实细节→从三种特征卡匹配→领取原创灵感标签。", "消失的灵感标签", "서울 성동구 성수동2가 275-28", "完成一项有效观察及描述选择；不要求进入店铺。", "第一关审美风格记录供 03 调用；使用场景变化时可替换成公共可见细节。", "地图位置为暂定参考点，待现场核实"], ["Daelim Changgo", 37.5409, 127.056, "显示有来源的建筑新旧图卡→在外观寻找保存的结构/材质→三选一配对→揭晓历史说明。", "时间的错位拼图", "서울 성동구 성수동2가 322-32", "玩家完成配对或查看合理提示后的答案；不因答错永久失败。", "时间关键词链接 06 工艺延续；旧图片授权和建筑史实先核实。", "地图位置为暂定参考点，待现场核实"], ["MUSINSA", 37.5404, 127.0559, "读取 01 风格→虚拟衣橱选上衣、下装、配饰→选择自由搭配或风格挑战→生成造型卡与免费小结局。", "今日造型任务", "서울 성동구 성수동2가 324-2", "完成三件组合及身份标签，解锁 3/9 卡与 PLUS 预览。", "首次完整满足感与一次跨关反馈；升级页展示 04/05 的真实样例，而非纯锁屏。", "地图位置为暂定参考点，待现场核实"], ["fwee", 37.5409857, 127.0551593, "读取 03 风格→挑主色与辅助色→设定比例→生成原创情绪色卡（不暗示品牌实际色号）。", "今日情绪调色室", "서울 성동구 성수동2가 309-145", "保存色彩组合即可，不要求试妆。", "付费第一关必须具有明显“动手创造”差异；商家权益仅在完成后、真实合作时选择查看。", "坐标来自品牌官网地图链接"], ["Point of View", 37.5441, 127.0511, "从六类虚拟小物选三件→逐步舍弃两件→留下最珍贵物品→解释理由或用预设句。", "只能留下的一件物品", "서울 성동구 성수동1가 16-39", "完成一件虚拟藏品和一句理由。", "最后结局原样回访该物件；商品素材未经许可不可用于商业宣传。", "地图位置为暂定参考点，待现场核实"], ["手工鞋街", 37.5445, 127.0557, "公共区域观察鞋底/缝线等细节→选择用途解释→读简短工艺知识→与 02 时间词呼应。", "工艺侦探", "서울특별시 성동구 성수동2가", "完成观察+配对；多答案时以解释型反馈代替错误惩罚。", "突出本地性，避免游戏仅剩购物；不要求工坊进入或购买。", "地图位置为暂定参考点，待现场核实"], ["Perment", 37.5474, 127.0435, "系统提供“走累了想休息”等轻情境→组合风味关键词→生成 Taste 卡→产生下一站观察词。", "给今天调一杯味道", "서울 성동구 성수동1가 668-73", "完成两项味觉偏好选择。", "可在合作时附自愿饮品权益，不虚构菜单；地址/业态待核实。", "地图位置为暂定参考点，待现场核实"], ["首尔林", 37.5444, 127.0374, "引用 07 情绪词→在安全步道寻找一种景观感受→写一句话或点词卡→获得 Peace。", "隐藏风景", "서울 성동구 성수동1가 685-20", "一个公共安全空间观察+关键词即可；无需 GPS 精准定位。", "天气恶劣触发数字景观图卡，仍获得碎片，另附收藏图章。", "地图位置为暂定参考点，待现场核实"], ["Warm Ending", 37.5475781, 127.0428383, "玩家完成前八个任务后，可前往推荐晚餐地点享受一天探索后的休息时光→回顾已收集的八块记忆碎片→选择最想保存的三个瞬间→用一句话记录今天的心情→系统根据前序任务中的个人选择生成完整的9/9城市记忆卡、专属称号及圣水洞限定数字印章。", "第九个瞬间", "최가네샤브샤브버섯칼국수（圣水洞晚餐店）서울 성동구 성수동1가 668-99", "完成记忆回顾并领取最终数字成果，即视为通关。不要求实际用餐或消费。", "", "地址坐标已查到"]];

function locked(i){return (i>=3&&(!state.paid||state.done.filter(x=>x<3).length<3))||(i===8&&state.done.filter(x=>x<8).length<8)}
function init(){try{if(!window.maplibregl)throw Error('地图组件未加载');map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[127.049,37.544],zoom:16,pitch:52,bearing:-20,maxPitch:70});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');map.on('load',()=>{
const layers=map.getStyle().layers;
const buildings=layers.filter(l=>l['source-layer']==='building');
const existing=buildings.filter(l=>l.type==='fill-extrusion');
if(!existing.length && buildings.length){const source=buildings[0].source;map.addLayer({id:'sq-buildings',type:'fill-extrusion',source,'source-layer':'building',minzoom:14,paint:{'fill-extrusion-color':'#c4bdd3','fill-extrusion-height':['coalesce',['to-number',['get','render_height'],12],12],'fill-extrusion-base':['coalesce',['to-number',['get','render_min_height'],0],0],'fill-extrusion-opacity':0.85}},layers.find(l=>l.type==='symbol')?.id);}
map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
map.addLayer({id:'route-glow',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#ffffff','line-width':9}});
map.addLayer({id:'route',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#8056cd','line-width':5,'line-dasharray':[2,1]}});
drawMap();overview();
});map.on('error',()=>{$('message').textContent='部分地图资源可能未加载，请检查网络；任务仍可体验。'}); map.on('idle',()=>{if(map.areTilesLoaded()&&$('message').textContent.startsWith('部分地图'))$('message').textContent='';});}catch(e){map=null;$('message').textContent='3D 地图未能启动（需要 WebGL 和联网），任务仍可体验。'}}
function drawMap(){if(!map||!map.getSource('route'))return;markers.forEach(m=>m.remove());markers=[];const coords=tasks.map(t=>[t[2],t[1]]);map.getSource('route').setData({type:'FeatureCollection',features:area==='seongsu'?[{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:coords}}]:[]});if(area!=='seongsu')return;tasks.forEach((t,i)=>{const el=document.createElement('button');el.className='pin '+(state.done.includes(i)?'done':locked(i)?'locked':'')+(i===selected?' active':'');el.textContent=state.done.includes(i)?'✓':i+1;el.title=t[0];el.setAttribute('aria-label',t[0]);el.onclick=e=>{e.stopPropagation();choose(i,false)};markers.push(new maplibregl.Marker({element:el}).setLngLat(coords[i]).addTo(map))})}
function overview(){if(!map)return;if(area==='seongsu'){const b=new maplibregl.LngLatBounds();tasks.forEach(t=>b.extend([t[2],t[1]]));map.fitBounds(b,{padding:65,maxZoom:16.5,pitch:is3D?52:0,bearing:is3D?-20:0,duration:850})}else{const a=areas[area];map.flyTo({center:[a.center[1],a.center[0]],zoom:a.zoom,pitch:is3D?52:0,bearing:is3D?-20:0})}}

const words25={zh:['生成结果','领取记忆碎片 +1','你的专属记忆','请选择所有选项','免费章节','PLUS 章节','模拟解锁 · 无实际支付','解锁后六关及完整城市记忆卡','完成前三关后解锁，无实际收费。','已收集','未收集','请先完成前三关','下一站','免费试玩完成！'],en:['Create result','Collect memory +1','Your memory','Complete all selections','FREE CHAPTERS','PLUS CHAPTERS','Simulate unlock · No charge','Unlock six more quests and your city memory card','Complete the first three quests. No actual charge.','Collected','Not collected','Complete the first three quests','Next quest','Free trial complete!'],ko:['결과 만들기','기억 조각 받기 +1','나의 기억','모든 항목을 선택하세요','무료 챕터','PLUS 챕터','모의 잠금 해제 · 결제 없음','나머지 여섯 미션과 도시 기억 카드','첫 세 미션을 완료하세요. 실제 결제 없음.','수집 완료','미수집','첫 세 미션을 완료하세요','다음 미션','무료 체험 완료!'],ja:['結果を作る','記憶のかけらを受け取る +1','あなたの記憶','すべて選択してください','無料チャプター','PLUS チャプター','模擬解除・決済なし','残り六つのミッションと街の記憶カード','最初の三つを完了してください。実際の課金なし。','収集済み','未収集','最初の三つを完了してください','次のミッション','無料体験完了！']};
const W=i=>words25[lang][i];let draft={},resultReady=false;state.answers=state.answers||{};
function esc25(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card25(i,head=false){let done=state.done.includes(i),lock=i>=3&&!state.paid;return `<div class="memory ${i>=3?'plus':''} ${done?'collected':''} ${head?'memory-head':''}"><small>QUEST ${String(i+1).padStart(2,'0')}</small>${icon25(i)}<b>${themes[i]}</b><span>${esc25(copy24[lang][i][1])}</span><em>${done?'✓ '+W(9):lock?'🔒 PLUS':i<3?'FREE':'PLUS'}</em></div>`}
puzzleHTML=function(){return `<div class="memory-label">${W(4)}</div><div class="puzzle">${[0,1,2].map(i=>card25(i)).join('')}</div><div class="memory-label">${W(5)}</div><div class="puzzle">${[3,4,5,6,7,8].map(i=>card25(i)).join('')}</div>`};
const oldPhoto=photoCover;photoCover=function(i,done){return card25(i,true)+ (official[i]?`<a class="photo-link" href="${official[i]}" target="_blank" rel="noopener">${T('official')} ↗</a>`:'')};
function fullPack(){let ready=state.done.filter(i=>i<3).length===3;return `<div class="fullpack"><div class="eyebrow">FULL QUEST / PLUS</div><h2>₩5,000</h2><p>${W(7)}</p><div class="puzzle">${[3,4,5,6,7,8].map(i=>card25(i)).join('')}</div><p>${W(8)}</p><button class="primary" ${ready?'':'disabled'} onclick="unlock()">${W(6)}</button></div>`}
function option25(q,k){if(selected===8&&q===0){draft.favorites=draft.favorites||[];let a=draft.favorites;if(a.includes(k))draft.favorites=a.filter(x=>x!==k);else if(a.length<3)a.push(k)}else draft[q]=k;resultReady=false;render()}
function ready25(){return selected===8?(draft.favorites||[]).length===3&&!!(draft.text||'').trim():Number.isInteger(draft[0])&&Number.isInteger(draft[1])}
function result25(i,a){if(!a)return '';if(i===8)return (a.favorites||[]).map(k=>themes[k]).join(' · ')+' — '+(a.text||'');let q=questions[lang][i];return [q[1].split('|')[a[0]],q[3].split('|')[a[1]]].filter(Boolean).join(' × ')}
function interaction25(){let i=selected,q=questions[lang][i];if(resultReady)return `<div class="quest-result"><div class="eyebrow">${W(2)}</div>${card25(i,true)}<p class="resultline">${esc25(result25(i,draft))}</p><button class="primary" onclick="checkin()">${W(1)}</button></div>`;return `<div class="question"><b>① ${q[0]}</b><div class="choices">${(i===8?themes.slice(0,8):q[1].split('|')).map((x,k)=>`<button class="${(i===8?(draft.favorites||[]).includes(k):draft[0]===k)?'chosen':''}" onclick="option25(0,${k})">${esc25(x)}</button>`).join('')}</div></div><div class="question"><b>② ${q[2]}</b>${i===8?`<textarea oninput="draft.text=this.value;document.getElementById('makeResult').disabled=!ready25()" maxlength="160">${esc25(draft.text)}</textarea>`:`<div class="choices">${q[3].split('|').map((x,k)=>`<button class="${draft[1]===k?'chosen':''}" onclick="option25(1,${k})">${esc25(x)}</button>`).join('')}</div>`}</div><button id="makeResult" class="primary" ${ready25()?'':'disabled'} onclick="resultReady=true;render()">${W(0)}</button>`}
const baseRender25=render;render=function(){baseRender25();let p=$('content');if(view==='full'){p.innerHTML=`<div class="eyebrow">CHAPTER 02–03</div><h2>${W(13)}</h2>${fullPack()}<button onclick="showView('puzzle')">${T('puzzle')}</button>`;return}if(view==='quest'&&area==='seongsu'){let d=p.querySelector('.detail'),b=d?.querySelector('button.primary');if(b&&started.has(selected)&&!locked(selected)&&!state.done.includes(selected)){b.outerHTML=interaction25()}if(state.done.includes(selected)&&state.answers[selected])d?.insertAdjacentHTML('beforeend',`<div class="quest-result"><b>${W(2)}</b><p>${esc25(result25(selected,state.answers[selected]))}</p></div>`);if(locked(selected)&&selected>=3&&!state.paid)d?.insertAdjacentHTML('beforeend',fullPack())}if(state.done.length===9&&view==='puzzle'){p.insertAdjacentHTML('beforeend',`<div class="quest-result"><h3>SEONGSU · 9/9</h3>${themes.map((t,i)=>`<p><b>${t}</b> ${esc25(result25(i,state.answers[i]))}</p>`).join('')}</div>`)}};
const baseChoose25=choose;choose=function(i,pan=true){started.clear();draft={};resultReady=false;baseChoose25(i,pan)};
startQuest=function(){draft={};resultReady=false;started.add(selected);render()};
// Audio is resumed during the direct user gesture; schedule notes only after resume.
playChime=function(){if(!sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=audio||new A();const play=()=>{const now=audio.currentTime+.035;[523.25,659.25,783.99,1046.5].forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=now+i*.105;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.18,t+.018);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.34)})};if(audio.state==='running')play();else audio.resume().then(play).catch(()=>{})}catch(e){}};
const baseToggle25=toggleSound;toggleSound=function(){baseToggle25();if(sound)playChime()};
checkin=function(){if(locked(selected)||state.done.includes(selected)||!ready25()||!resultReady)return;const i=selected;state.answers[i]=JSON.parse(JSON.stringify(draft));state.done.push(i);started.clear();save();drawMap();render();celebrate(i);if(i<3&&!state.paid&&state.done.filter(x=>x<3).length===3){setTimeout(()=>{if(view==='quest'&&selected===i&&!state.paid)showView('full')},1250)}};
unlock=function(){if(state.done.filter(x=>x<3).length!==3)return;state.paid=true;save();choose(3)};
const baseReset25=resetDemo;resetDemo=function(){baseReset25();state.answers=state.answers||{};draft={};resultReady=false;};
document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{switchArea(b.dataset.area);document.getElementById('message').textContent=''});function search(){let s=document.getElementById('search').value.trim().toLowerCase();let a=/圣水|聖水|성수|seongsu/.test(s)?'seongsu':/弘大|홍대|hongdae/.test(s)?'hongdae':/汉南|漢南|한남|hannam/.test(s)?'hannam':null;if(a){switchArea(a);document.getElementById('message').textContent=''}else document.getElementById('message').textContent=T('searchHint')}document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();search()};document.getElementById('search').onchange=search;init();render();weatherUpdate();setInterval(weatherUpdate,600000);
</script></body></html>
