function esc25(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

playChime=function(){if(!sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=audio||new A();const play=()=>{const now=audio.currentTime+.035;[523.25,659.25,783.99,1046.5].forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=now+i*.105;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.18,t+.018);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.34)})};if(audio.state==='running')play();else audio.resume().then(play).catch(()=>{})}catch(e){}};
