function drawMap(){if(!map||!map.getSource('route'))return;markers.forEach(m=>m.remove());markers=[];const coords=tasks.map(t=>[t[2],t[1]]);map.getSource('route').setData({type:'FeatureCollection',features:area==='seongsu'?[{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:coords}}]:[]});if(area!=='seongsu')return;tasks.forEach((t,i)=>{const el=document.createElement('button');el.className='pin '+(state.done.includes(i)?'done':locked(i)?'locked':'')+(i===selected?' active':'');el.textContent=state.done.includes(i)?'✓':i+1;el.title=t[0];el.setAttribute('aria-label',t[0]);el.onclick=e=>{e.stopPropagation();choose(i,false)};markers.push(new maplibregl.Marker({element:el}).setLngLat(coords[i]).addTo(map))})}
function overview(){if(!map)return;if(area==='seongsu'){const b=new maplibregl.LngLatBounds();tasks.forEach(t=>b.extend([t[2],t[1]]));map.fitBounds(b,{padding:65,maxZoom:16.5,pitch:is3D?52:0,bearing:is3D?-20:0,duration:850})}else{const a=areas[area];map.flyTo({center:[a.center[1],a.center[0]],zoom:a.zoom,pitch:is3D?52:0,bearing:is3D?-20:0})}}
function toggle3D(){is3D=!is3D;$('mode').textContent=T('switch')+(is3D?' 2D':' 3D');if(map){for(const l of map.getStyle()?.layers||[]){if(l.type==='fill-extrusion')map.setLayoutProperty(l.id,'visibility',is3D?'visible':'none')}map.easeTo({pitch:is3D?52:0,bearing:is3D?-20:0,duration:700})}}
function choose(i,pan=true){selected=i;view='quest';listOpen=false;render();drawMap();if(map&&pan)map.easeTo({center:[tasks[i][2],tasks[i][1]],duration:650});$('panel').scrollTop=0}

function roll26(){if(!complete26()||state.prizeIndex!=null||rolling26)return;rolling26=true;playChime();let token=++anim26;let button=$('spin26');button.disabled=true;button.textContent=L(16);let start=performance.now(),last=start,bs=balls26.slice();bs.forEach(b=>{b.vx=(Math.random()-.5)*320;b.vy=-Math.random()*350});function frame(now){if(token!==anim26)return;let dt=Math.min(.035,(now-last)/1000);last=now;for(let b of bs){b.vy+=500*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<96||b.x>224){b.x=Math.max(96,Math.min(224,b.x));b.vx*=-1}if(b.y<48){b.y=48;b.vy=Math.abs(b.vy)}if(b.y>181){b.y=181;b.vy=-260-Math.random()*180;b.vx+=(Math.random()-.5)*100}}for(let i=0;i<bs.length;i++)for(let j=i+1;j<bs.length;j++){let a=bs[i],b=bs[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01;if(d<32){let o=(32-d)/2;a.x-=dx/d*o;a.y-=dy/d*o;b.x+=dx/d*o;b.y+=dy/d*o;let vx=a.vx,vy=a.vy;a.vx=b.vx;a.vy=b.vy;b.vx=vx;b.vy=vy}}for(let b of bs)b.g.setAttribute('transform',`translate(${b.x} ${b.y})`);$('knob26')?.setAttribute('transform',`rotate(${(now-start)*.4} 160 258)`);if(now-start<3600)requestAnimationFrame(frame);else{rolling26=false;let r=Math.random();state.prizeIndex=r<.5?0:r<.85?1:2;save();if(view==='gacha'){render();let c=$('caps26');if(c?.animate)c.animate([{transform:'translate(160px,290px)'},{transform:'translate(160px,323px)'}],{duration:450,easing:'ease-out'})}}}requestAnimationFrame(frame)}
function open26(){if(!complete26()||state.prizeIndex==null||state.prizeOpened||opening26)return;opening26=true;state.prizeOpened=true;state.couponStage=0;save();playChime();$('spin26').disabled=true;$('upper26').style.transform='translate(-20px,-35px) rotate(-25deg)';$('lower26').style.transform='translate(20px,5px) rotate(25deg)';let token=anim26;setTimeout(()=>{opening26=false;if(token===anim26&&view==='gacha'){render();$('prizeResult26').classList.add('prize26');$('prizeResult26').insertAdjacentHTML('afterbegin',`<h2>${L(18)} ✦</h2><p>${L(35)}</p>`);confetti26()}},750)}
function confetti26(){const c=$('fireworks'),ctx=c.getContext('2d'),d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;ctx.scale(d,d);let p=Array.from({length:140},(_,i)=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*950,vy:-Math.random()*480,c:['#ff6b9d','#ffd166','#8c65e8','#54d8c3','#64a7ff'][i%5]}));let start=performance.now();function f(n){let t=(n-start)/1000;ctx.clearRect(0,0,innerWidth,innerHeight);if(t>1.8)return;ctx.globalAlpha=Math.max(0,1-t/1.8);for(let a of p){ctx.fillStyle=a.c;ctx.fillRect(a.x+a.vx*t,a.y+a.vy*t+310*t*t,6,9)}ctx.globalAlpha=1;requestAnimationFrame(f)}requestAnimationFrame(f)}
