<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noarchive"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SIDE QUEST · Seoul</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#29233b;background:#eeeaf5}button,input{font:inherit}form button{white-space:nowrap;flex-shrink:0}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:#eee8fa;color:#6545b0;font-weight:650}button:hover{filter:brightness(.96)}button:disabled{opacity:.5;cursor:default}#map{position:fixed;inset:68px 390px 0 0;background:#e4e0ed}header{height:68px;position:fixed;inset:0 0 auto;display:flex;align-items:center;gap:22px;padding:0 22px;background:#fff;z-index:5;border-bottom:1px solid #e6e0ee}h1{font-size:22px;letter-spacing:2px;margin:0;color:#39255b;white-space:nowrap}.brand small{font-size:10px;color:#8b7c9e}form{display:flex;gap:6px;flex:1;max-width:440px}input{width:100%;min-width:0;border:1px solid #e6dff1;border-radius:10px;background:#f8f6fc;padding:10px 12px;outline-color:#9270dc}nav{margin-left:auto;display:flex;gap:6px}aside{position:fixed;top:80px;right:12px;bottom:12px;width:366px;overflow:auto;background:white;border:1px solid #e9e1f3;border-radius:20px;padding:20px;box-shadow:0 10px 40px #39255b12;z-index:3}small,.muted{color:#857994}h2{font-size:23px;margin:5px 0 8px}h3{margin:8px 0}p{line-height:1.65;margin:8px 0}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:#805ac6}.progress{height:7px;background:#eee9f5;border-radius:20px;overflow:hidden;margin:10px 0 16px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#6944ba,#b18af4);border-radius:20px}.primary{background:#7751c7;color:white;width:100%;padding:13px}.task{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#f7f5fa;margin:4px 0;font-size:12px}.task.active{background:#e9dffc}.num{background:#7954cb;color:white;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;flex:none}.status{margin-left:auto;font-size:10px;color:#857994}details{margin:10px 0 15px;border:1px solid #e9e1f3;border-radius:12px;padding:10px}summary{cursor:pointer;font-weight:650;color:#6845b2}.hero{height:116px;border-radius:14px;background:radial-gradient(circle at 78% 24%,#d9c6ff 0 12%,transparent 13%),linear-gradient(145deg,#30234f,#7e56c9 60%,#bda1ef);color:white;display:flex;align-items:end;justify-content:space-between;padding:15px;overflow:hidden}.hero strong{font-size:36px;letter-spacing:-2px}.hero span{font-size:11px;letter-spacing:2px}.detail{padding:12px 0}.section{font-size:10px;letter-spacing:1.5px;color:#805ac6;font-weight:800;margin-top:15px}.mission{background:#f5f1fc;padding:12px;border-radius:12px}.puzzle{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:220px;margin:10px auto}.piece{aspect-ratio:1;display:grid;place-items:center;border-radius:7px;background:#ece7f4;color:#9a8bad;font-weight:700}.piece.open{background-image:var(--art);background-size:300% 300%;background-position:var(--pos);color:transparent}.pin{width:34px;height:34px;background:#7954cb;color:white;border:3px solid white;border-radius:50%;display:grid;place-items:center;font-weight:800;box-shadow:0 3px 10px #34245755;padding:0}.pin.locked{background:#9185a9}.pin.done{background:#398b72}.pin.active{outline:4px solid #b99af0}.chips{position:fixed;top:82px;left:14px;display:flex;gap:6px;z-index:2}.chips button,.maptools button{background:white;box-shadow:0 2px 12px #39255b20}.chips button.active{background:#7954cb;color:white}.maptools{position:fixed;bottom:35px;left:14px;z-index:2;display:flex;gap:6px}.minipuzzle{position:fixed;bottom:83px;left:14px;z-index:2;padding:12px;background:white;border-radius:14px;box-shadow:0 4px 20px #39255b20}.minirow{display:flex;gap:3px;margin-top:7px}.minirow i{width:15px;height:15px;border-radius:3px;background:#eee8f7}.minirow i.on{background:#7954cb}#message{position:fixed;top:128px;left:14px;background:white;border-radius:8px;max-width:300px;padding:8px;z-index:4;color:#7751c7}#message:empty{display:none}.note{font-size:11px;color:#8b8195}.maplibregl-ctrl-bottom-right{bottom:4px}.reward{padding:16px;text-align:center;border:1px dashed #9d7bdc;border-radius:14px;background:#f8f3ff} @media(max-width:780px){header{height:110px;flex-wrap:wrap;gap:6px;padding:9px 12px}h1{font-size:18px}nav{gap:3px}nav button{padding:7px;font-size:12px}form{order:3;max-width:none;flex-basis:100%}#map{inset:110px 0 48% 0}aside{top:53%;left:8px;right:8px;bottom:8px;width:auto;padding:15px}.chips{top:120px;left:8px}.maptools{bottom:49%;left:8px}.minipuzzle{display:none}#message{top:168px}.hero{height:90px}}
</style></head><body><header><div class="brand"><h1>SIDE QUEST</h1><small>Life isn’t just a main quest.</small></div><form id="searchForm"><input id="search" placeholder="搜索圣水洞 / 弘大 / 汉南洞" aria-label="搜索商圈" list="districts"><datalist id="districts"><option value="圣水洞"><option value="弘大"><option value="汉南洞"></datalist><button type="submit">搜索</button></form><nav><button onclick="showView('quest')">探索地图</button><button onclick="showView('puzzle')">我的拼图</button></nav></header><div id="map" role="region" aria-label="城市探索互动地图"></div><div class="chips" id="chips"><button data-area="seongsu">圣水洞</button><button data-area="hongdae">弘大</button><button data-area="hannam">汉南洞</button></div><div id="message" role="status"></div><div class="maptools"><button id="mode" onclick="toggle3D()">切换 2D</button><button onclick="overview()">路线全览</button></div><button class="minipuzzle" onclick="showView('puzzle')" id="mini"></button><aside id="panel"></aside><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const tasks=[
['圣水站 · 起点',37.5446,127.0559,'找到一个能代表圣水的街头符号。','故事从一张遗失的城市明信片开始。'],
['圣水街区 · 示范点',37.5437,127.0545,'观察街边建筑，记录一种颜色。','第一条线索藏在城市的色彩中。'],
['MUSINSA · 待核实位置',37.5428,127.0532,'寻找一件代表你今日心情的设计。','风格也是一种城市语言。'],
['红砖建筑 · 示范点',37.5421,127.0518,'寻找红砖纹理并拍照留念。','旧建筑保存着新的故事。'],
['咖啡街 · 示范点',37.5419,127.0501,'记录一处让你想停留的角落。','慢下来才能发现下一条线索。'],
['设计空间 · 示范点',37.5430,127.0488,'发现一个有趣的设计细节。','把灵感收藏进你的城市日记。'],
['首尔林街区 · 示范点',37.5442,127.0467,'寻找一处自然与城市交汇的画面。','故事逐渐接近尾声。'],
['首尔林 · 日落',37.5448,127.0408,'观察天空，记录此刻的心情。','最后的光照亮了明信片。'],
['结局 · 可选晚餐',37.5470,127.0450,'在公共区域或可选晚餐店完成故事结局，无需消费。','九块记忆拼成完整的城市明信片。']];
const areas={seongsu:{name:'圣水洞',center:[37.544,127.049],zoom:15},hongdae:{name:'弘大',center:[37.557,126.923],zoom:15},hannam:{name:'汉南洞',center:[37.534,127.002],zoom:15}};
let state={done:[],paid:false,reward:false};try{state={...state,...JSON.parse(localStorage.getItem('sidequest-v1')||'{}')}}catch(e){}let area='seongsu',selected=0,map,layer,markers=[];
const art='url("data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#eadbc4"/><circle cx="230" cy="60" r="40" fill="#d99c6a"/><path d="M0 180 Q80 90 155 165 T300 140 V300 H0Z" fill="#88a18b"/><path d="M40 230V105L125 70 200 105V230Z" fill="#a86f59"/><path d="M65 130h30v40H65z M115 130h30v40h-30z M155 130h25v40h-25z" fill="#f5dfb7"/><path d="M0 250h300v50H0z" fill="#506f5d"/><text x="150" y="280" font-size="23" font-family="sans-serif" text-anchor="middle" fill="white">SEONGSU</text></svg>')+'")';
function save(){try{localStorage.setItem('sidequest-v1',JSON.stringify(state))}catch(e){}}

let view='quest',is3D=true,listOpen=false;const $=id=>document.getElementById(id);
function locked(i){return i>=3&&(!state.paid||state.done.filter(x=>x<3).length<3)}
function init(){try{if(!window.maplibregl)throw Error('地图组件未加载');map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[127.049,37.544],zoom:16,pitch:52,bearing:-20,maxPitch:70});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');map.on('load',()=>{
const layers=map.getStyle().layers;
const buildings=layers.filter(l=>l['source-layer']==='building');
const existing=buildings.filter(l=>l.type==='fill-extrusion');
if(!existing.length && buildings.length){const source=buildings[0].source;map.addLayer({id:'sq-buildings',type:'fill-extrusion',source,'source-layer':'building',minzoom:14,paint:{'fill-extrusion-color':'#c4bdd3','fill-extrusion-height':['coalesce',['to-number',['get','render_height'],12],12],'fill-extrusion-base':['coalesce',['to-number',['get','render_min_height'],0],0],'fill-extrusion-opacity':0.85}},layers.find(l=>l.type==='symbol')?.id);}
map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
map.addLayer({id:'route-glow',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#ffffff','line-width':9}});
map.addLayer({id:'route',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#8056cd','line-width':5,'line-dasharray':[2,1]}});
drawMap();overview();
});map.on('error',()=>{$('message').textContent='部分地图资源可能未加载，请检查网络；任务仍可体验。'}); map.on('idle',()=>{if(map.areTilesLoaded()&&$('message').textContent.startsWith('部分地图'))$('message').textContent='';});}catch(e){map=null;$('message').textContent='3D 地图未能启动（需要 WebGL 和联网），任务仍可体验。'}}
function drawMap(){if(!map||!map.getSource('route'))return;markers.forEach(m=>m.remove());markers=[];const coords=tasks.map(t=>[t[2],t[1]]);map.getSource('route').setData({type:'FeatureCollection',features:area==='seongsu'?[{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:coords}}]:[]});if(area!=='seongsu')return;tasks.forEach((t,i)=>{const el=document.createElement('button');el.className='pin '+(state.done.includes(i)?'done':locked(i)?'locked':'')+(i===selected?' active':'');el.textContent=state.done.includes(i)?'✓':i+1;el.title=t[0];el.setAttribute('aria-label',t[0]);el.onclick=e=>{e.stopPropagation();choose(i,false)};markers.push(new maplibregl.Marker({element:el}).setLngLat(coords[i]).addTo(map))})}
function overview(){if(!map)return;if(area==='seongsu'){const b=new maplibregl.LngLatBounds();tasks.forEach(t=>b.extend([t[2],t[1]]));map.fitBounds(b,{padding:65,maxZoom:16.5,pitch:is3D?52:0,bearing:is3D?-20:0,duration:850})}else{const a=areas[area];map.flyTo({center:[a.center[1],a.center[0]],zoom:a.zoom,pitch:is3D?52:0,bearing:is3D?-20:0})}}
function toggle3D(){is3D=!is3D;$('mode').textContent=is3D?'切换 2D':'切换 3D';if(map){for(const l of map.getStyle()?.layers||[]){if(l.type==='fill-extrusion')map.setLayoutProperty(l.id,'visibility',is3D?'visible':'none')}map.easeTo({pitch:is3D?52:0,bearing:is3D?-20:0,duration:700})}}
function choose(i,pan=true){selected=i;view='quest';listOpen=false;render();drawMap();if(map&&pan)map.easeTo({center:[tasks[i][2],tasks[i][1]],duration:650});$('panel').scrollTop=0}
function switchArea(a){area=a;selected=0;view='quest';listOpen=false;drawMap();overview();render()}
function showView(v){view=v;render();$('panel').scrollTop=0}
function puzzleHTML(){return `<div class="puzzle">${tasks.map((_,i)=>`<div class="piece ${state.done.includes(i)?'open':''}" style="--pos:${i%3*50}% ${Math.floor(i/3)*50}%;--art:${art.replaceAll('"','&quot;')}">${i+1}</div>`).join('')}</div>`}
function render(){const p=$('panel');$('mini').innerHTML=`MY PUZZLE · ${state.done.length}/9<div class="minirow">${tasks.map((_,i)=>`<i class="${state.done.includes(i)?'on':''}"></i>`).join('')}</div>`;document.querySelectorAll('[data-area]').forEach(b=>b.classList.toggle('active',b.dataset.area===area));const progress=`<div class="eyebrow">CHAPTER 01 / SEONGSU</div><h2>圣水探索计划</h2><small>探索进度 ${state.done.length}/9 · 前3站免费</small><div class="progress"><i style="width:${state.done.length/9*100}%"></i></div>`;const freeDone=state.done.filter(x=>x<3).length===3;const unlockHTML=freeDone&&!state.paid?'<div class="mission"><b>免费试玩已完成！</b><p>继续探索剩余6站，拼成完整城市明信片。</p><button class="primary" onclick="unlock()">模拟付费 · 解锁完整路线</button></div>':'';const rewardHTML=state.done.length===9?`<div class="reward"><div class="eyebrow">SEONGSU EXPLORER</div><h3>${state.reward?'✦ 圣水限定数字印章':'完整拼图已集齐！'}</h3>${state.reward?'<p>商家优惠券示例（无实际兑换价值）</p>':'<button class="primary" onclick="claim()">领取最终奖励（模拟）</button>'}</div>`:'';if(view==='puzzle'){p.innerHTML=progress+`<h3>我的拼图 / COLLECTION</h3>${puzzleHTML()}${unlockHTML}${rewardHTML}<button onclick="showView('quest')">返回探索</button><p class="note">示例拼图 · 进度保存在当前浏览器。</p><button onclick="resetDemo()">重置演示</button>`;return}if(area!=='seongsu'){p.innerHTML=`<div class="eyebrow">FUTURE CHAPTER</div><h2>${areas[area].name}</h2><div class="hero"><strong>SOON</strong><span>NEW QUEST</span></div><p>路线筹备中，敬请期待。</p><button class="primary" onclick="switchArea('seongsu')">返回圣水试点</button>`;return}const t=tasks[selected],done=state.done.includes(selected);p.innerHTML=progress+`<details ${listOpen?'open':''} id="tasklist"><summary>全部任务 · 9 站</summary>${tasks.map((x,i)=>`<button class="task ${i===selected?'active':''}" onclick="choose(${i})"><span class="num">${i+1}</span>${x[0]}<span class="status">${state.done.includes(i)?'✓':i<3?'FREE':locked(i)?'LOCK':'OPEN'}</span></button>`).join('')}</details><div class="hero"><strong>0${selected+1}</strong><span>${done?'COMPLETED':locked(selected)?'LOCKED':selected<3?'FREE QUEST':'SIDE QUEST'}</span></div><div class="detail"><div class="eyebrow">QUEST 0${selected+1} · 约60分钟（示例）</div><h2>${t[0]}</h2>${locked(selected)?'<p>完成前三站并模拟付费后，解锁进阶任务。</p>':`<div class="section">STORY / 故事线索</div><p>${t[4]}</p><div class="section">MISSION / 探索任务</div><p class="mission">${t[3]}</p>`}<button class="primary" ${done||locked(selected)?'disabled':''} onclick="checkin()">${done?'已完成 ✓':locked(selected)?'进阶任务未解锁':'模拟打卡 · 收集拼图'}</button></div>${unlockHTML}${rewardHTML}<button onclick="choose(${(selected+1)%9})">下一站 →</button> <button onclick="showView('puzzle')">查看拼图</button><p class="note">课堂原型 · 坐标与任务为示例；虚线仅表示探索顺序，非步行导航。3D 建筑来自 OpenStreetMap 建筑轮廓与高度数据，缺失高度可能为估算值。未接入定位或支付。</p>`;$('tasklist').ontoggle=()=>{listOpen=$('tasklist')?.open||false}}
function checkin(){if(locked(selected)||state.done.includes(selected))return;state.done.push(selected);save();drawMap();render()}
function unlock(){if(state.done.filter(x=>x<3).length!==3)return;state.paid=true;save();drawMap();render()}
function claim(){if(state.done.length===9){state.reward=true;save();render()}}
function resetDemo(){if(confirm('清除当前演示进度？')){state={done:[],paid:false,reward:false};save();drawMap();render()}}
document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{switchArea(b.dataset.area);document.getElementById('message').textContent=''});function search(){let s=document.getElementById('search').value.trim().toLowerCase();let a=/圣水|聖水|성수|seongsu/.test(s)?'seongsu':/弘大|홍대|hongdae/.test(s)?'hongdae':/汉南|漢南|한남|hannam/.test(s)?'hannam':null;if(a){switchArea(a);document.getElementById('message').textContent=''}else document.getElementById('message').textContent='目前支持圣水洞、弘大、汉南洞。'}document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();search()};document.getElementById('search').onchange=search;init();render();
</script></body></html>
