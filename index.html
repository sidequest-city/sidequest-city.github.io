function date26(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('.')}
function ensure26(){if(complete26()&&!state.completedDate){state.completedDate=date26();state.reward=true;save()}}
function stamp26(){return `<div class="stamp26"><img src="${stampAsset26}" alt="SIDE QUEST SEONGSU"><strong>${esc25(state.completedDate||'')}</strong><p>${L(3)} · ${L(4)}</p></div>`}
function memory26(){return `<div class="quest-result"><h3>${L(5)}</h3><p><b>SEONGSU EXPLORER</b> · ${esc25(state.completedDate||'')}</p><p>${L(27)}: ${(state.answers[8]?.favorites||[]).map(i=>themes[i]).join(' · ')}</p><p>${esc25(state.answers[8]?.text||'')}</p>${themes.map((t,i)=>`<p><b>${t}</b> · ${esc25(result25(i,state.answers[i]))}</p>`).join('')}</div>`}
function download26(){let a=document.createElement('a');let text='SIDE QUEST · SEONGSU EXPLORER\n'+state.completedDate+'\n'+themes.map((t,i)=>t+' : '+result25(i,state.answers[i])).join('\n');let u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='SEONGSU-memory-'+state.completedDate+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
