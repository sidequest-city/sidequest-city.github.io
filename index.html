<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIDE QUEST | Seoul</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:#302b40;background:#f4f2f8}#map{position:fixed;inset:0;background:#e5e8df}header,aside{position:absolute;z-index:500;background:#fffffff5;border-radius:18px;box-shadow:0 8px 35px #33234b22}header{top:16px;left:16px;width:340px;padding:18px}h1{font-size:23px;letter-spacing:3px;margin:0}small{color:#80768d}input{width:100%;padding:12px;border:1px solid #ddd5e7;border-radius:10px;margin:12px 0;font:inherit}button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font:inherit;background:#eee9f8;color:#644ba5}button:hover{filter:brightness(.95)}button:disabled{opacity:.5;cursor:default}.primary{background:#7555c4;color:white;width:100%;font-weight:600}aside{top:16px;right:16px;bottom:28px;width:350px;padding:19px;overflow:auto}h2{margin:8px 0}p{line-height:1.55}progress{width:100%;accent-color:#7555c4}.task{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#f8f6fb;margin:5px 0;padding:10px}.task.active{background:#e9dffc}.num{background:#7555c4;color:white;border-radius:50%;width:27px;height:27px;display:grid;place-items:center;flex:none}.status{margin-left:auto;font-size:11px;color:#81768d}.detail{background:#f4f0fa;padding:14px;border-radius:12px;margin:12px 0}.detail h3{margin:5px 0}.puzzle{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px auto;max-width:210px}.piece{aspect-ratio:1;display:grid;place-items:center;background:#e7e3ed;border-radius:5px;color:#776c85}.piece.open{background-image:var(--art);background-size:300% 300%;background-position:var(--pos);color:transparent}.pin{background:#7555c4;border:2px solid white;color:white;border-radius:50%;display:grid;place-items:center;font-weight:bold;box-shadow:0 2px 6px #3336}.pin.locked{background:#9d96ad}.pin.done{background:#398b72}.note{font-size:11px;color:#756c80}.leaflet-bottom.leaflet-left{margin-bottom:8px}#message{font-size:13px;color:#7755bb} @media(max-width:720px){header{left:10px;right:10px;top:10px;width:auto;padding:12px}aside{left:10px;right:10px;top:52%;bottom:26px;width:auto;padding:14px}#map{bottom:45%}h1{font-size:18px}}
</style></head><body><div id="map"></div><header><h1>SIDE QUEST</h1><small>Life isn’t just a main quest.</small><form id="searchForm"><input id="search" placeholder="搜索圣水洞 / 弘大 / 汉南洞" aria-label="搜索商圈" list="districts"><datalist id="districts"><option value="圣水洞"><option value="弘大"><option value="汉南洞"></datalist></form><div id="chips"><button data-area="seongsu">圣水洞</button> <button data-area="hongdae">弘大</button> <button data-area="hannam">汉南洞</button></div><div id="message"></div></header><aside id="panel"></aside><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
// 修改此处：地点名称、纬度、经度、任务与故事。以下坐标均为演示点，未核实店铺位置。
const tasks=[
['圣水站 · 起点',37.5446,127.0559,'找到一个能代表圣水的街头符号。','故事从一张遗失的城市明信片开始。'],
['圣水街区 · 示范点',37.5437,127.0545,'观察街边建筑，记录一种颜色。','第一条线索藏在城市的色彩中。'],
['MUSINSA · 待核实位置',37.5428,127.0532,'寻找一件代表你今日心情的设计。','风格也是一种城市语言。'],
['红砖建筑 · 示范点',37.5421,127.0518,'寻找红砖纹理并拍照留念。','旧建筑保存着新的故事。'],
['咖啡街 · 示范点',37.5419,127.0501,'记录一处让你想停留的角落。','慢下来才能发现下一条线索。'],
['设计空间 · 示范点',37.5430,127.0488,'发现一个有趣的设计细节。','把灵感收藏进你的城市日记。'],
['首尔林街区 · 示范点',37.5442,127.0467,'寻找一处自然与城市交汇的画面。','故事逐渐接近尾声。'],
['首尔林 · 日落',37.5448,127.0408,'观察天空，记录此刻的心情。','最后的光照亮了明信片。'],
['结局 · 可选晚餐',37.5470,127.0450,'在公共区域或可选晚餐店完成故事结局，无需消费。','九块记忆拼成完整的城市明信片。']];
const areas={seongsu:{name:'圣水洞',center:[37.544,127.049],zoom:15},hongdae:{name:'弘大',center:[37.557,126.923],zoom:15},hannam:{name:'汉南洞',center:[37.534,127.002],zoom:15}};
let state={done:[],paid:false,reward:false};try{state={...state,...JSON.parse(localStorage.getItem('sidequest-v1')||'{}')}}catch(e){}let area='seongsu',selected=0,map,layer,markers=[];
const art='url("data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#eadbc4"/><circle cx="230" cy="60" r="40" fill="#d99c6a"/><path d="M0 180 Q80 90 155 165 T300 140 V300 H0Z" fill="#88a18b"/><path d="M40 230V105L125 70 200 105V230Z" fill="#a86f59"/><path d="M65 130h30v40H65z M115 130h30v40h-30z M155 130h25v40h-25z" fill="#f5dfb7"/><path d="M0 250h300v50H0z" fill="#506f5d"/><text x="150" y="280" font-size="23" font-family="sans-serif" text-anchor="middle" fill="white">SEONGSU</text></svg>')+'")';
function save(){try{localStorage.setItem('sidequest-v1',JSON.stringify(state))}catch(e){}}
function init(){if(!window.L){document.getElementById('message').textContent='地图组件未加载，请联网刷新；任务仍可体验。';return}map=L.map('map',{zoomControl:false}).setView(areas.seongsu.center,15);L.control.zoom({position:'bottomleft'}).addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);layer=L.layerGroup().addTo(map);drawMap()}
function locked(i){return i>=3&&(!state.paid||state.done.filter(x=>x<3).length<3)}
function drawMap(){if(!map)return;layer.clearLayers();markers=[];if(area!=='seongsu')return;const coords=tasks.map(t=>[t[1],t[2]]);L.polyline(coords,{color:'#7555c4',weight:4,dashArray:'8 6'}).addTo(layer);tasks.forEach((t,i)=>{const icon=L.divIcon({className:'',html:`<div class="pin ${state.done.includes(i)?'done':locked(i)?'locked':''}" style="width:32px;height:32px">${state.done.includes(i)?'✓':i+1}</div>`,iconSize:[32,32],iconAnchor:[16,16]});const m=L.marker(coords[i],{icon}).addTo(layer).bindTooltip(t[0]);m.on('click',()=>choose(i,false));markers.push(m)})}
function choose(i,pan=true){selected=i;render();if(map&&pan)map.panTo([tasks[i][1],tasks[i][2]]);if(markers[i])markers[i].openTooltip()}
function switchArea(a){area=a;selected=0;if(map){map.setView(areas[a].center,areas[a].zoom);drawMap()}render()}
function render(){let p=document.getElementById('panel');if(area!=='seongsu'){p.innerHTML=`<small>FUTURE CHAPTER</small><h2>${areas[area].name}</h2><p>COMING SOON · 路线筹备中</p><button onclick="switchArea('seongsu')">返回圣水试点</button>`;return}const t=tasks[selected],done=state.done.includes(selected),freeDone=state.done.filter(x=>x<3).length===3; p.innerHTML=`<small>CHAPTER 01 · SEONGSU</small><h2>圣水探索计划</h2><small>探索进度 ${state.done.length}/9 · 前3站免费</small><progress value="${state.done.length}" max="9"></progress>${tasks.map((x,i)=>`<button class="task ${i===selected?'active':''}" onclick="choose(${i})"><span class="num">${i+1}</span>${x[0]}<span class="status">${state.done.includes(i)?'✓':i<3?'FREE':locked(i)?'LOCK':'OPEN'}</span></button>`).join('')}<div class="detail"><small>QUEST ${String(selected+1).padStart(2,'0')} · 约60分钟（示例）</small><h3>${t[0]}</h3>${locked(selected)?'<p>完成前三站后，解锁完整路线即可查看进阶任务。</p>':`<p>${t[4]}</p><b>探索任务</b><p>${t[3]}</p>`}<button class="primary" ${done||locked(selected)?'disabled':''} onclick="checkin()">${done?'已完成 ✓':locked(selected)?'进阶任务未解锁':'模拟打卡 · 收集拼图'}</button></div>${freeDone&&!state.paid?'<button class="primary" onclick="unlock()">模拟付费 · 解锁剩余6站</button>':''}<h3>我的拼图 ${state.done.length}/9</h3><div class="puzzle">${tasks.map((_,i)=>`<div class="piece ${state.done.includes(i)?'open':''}" style="--pos:${i%3*50}% ${Math.floor(i/3)*50}%;--art:${art.replaceAll('"','&quot;')}">${i+1}</div>`).join('')}</div>${state.done.length===9?`<button class="primary" onclick="claim()">${state.reward?'✓ 已领取圣水限定数字印章':'领取最终奖励（模拟）'}</button><p>${state.reward?'🏅 SEONGSU EXPLORER · 商家优惠券示例（无实际兑换价值）':''}</p>`:''}<p class="note">课堂原型：地点、任务和坐标为示例，连接线仅表示任务顺序，不是步行导航。未接入定位或真实支付。</p><button onclick="resetDemo()">重置演示</button>`}
function checkin(){if(locked(selected)||state.done.includes(selected))return;state.done.push(selected);save();drawMap();render()}
function unlock(){if(state.done.filter(x=>x<3).length!==3)return;state.paid=true;save();drawMap();render()}
function claim(){if(state.done.length===9){state.reward=true;save();render()}}
function resetDemo(){if(confirm('清除当前演示进度？')){state={done:[],paid:false,reward:false};save();drawMap();render()}}
document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{switchArea(b.dataset.area);document.getElementById('message').textContent=''});function search(){let s=document.getElementById('search').value.trim().toLowerCase();let a=/圣水|聖水|성수|seongsu/.test(s)?'seongsu':/弘大|홍대|hongdae/.test(s)?'hongdae':/汉南|漢南|한남|hannam/.test(s)?'hannam':null;if(a){switchArea(a);document.getElementById('message').textContent=''}else document.getElementById('message').textContent='目前支持圣水洞、弘大、汉南洞。'}document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();search()};document.getElementById('search').onchange=search;init();render();
</script></body></html>
