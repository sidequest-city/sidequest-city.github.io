const tasks=[["LCDC", 37.541, 127.0613, "玩家选“线条/材质/色彩”线索→观察开放区域真实细节→从三种特征卡匹配→领取原创灵感标签。", "消失的灵感标签", "서울 성동구 성수동2가 275-28", "完成一项有效观察及描述选择；不要求进入店铺。", "第一关审美风格记录供 03 调用；使用场景变化时可替换成公共可见细节。", "地图位置为暂定参考点，待现场核实"], ["Daelim Changgo", 37.5409, 127.056, "显示有来源的建筑新旧图卡→在外观寻找保存的结构/材质→三选一配对→揭晓历史说明。", "时间的错位拼图", "서울 성동구 성수동2가 322-32", "玩家完成配对或查看合理提示后的答案；不因答错永久失败。", "时间关键词链接 06 工艺延续；旧图片授权和建筑史实先核实。", "地图位置为暂定参考点，待现场核实"], ["MUSINSA", 37.5404, 127.0559, "读取 01 风格→虚拟衣橱选上衣、下装、配饰→选择自由搭配或风格挑战→生成造型卡与免费小结局。", "今日造型任务", "서울 성동구 성수동2가 324-2", "完成三件组合及身份标签，解锁 3/9 卡与 PLUS 预览。", "首次完整满足感与一次跨关反馈；升级页展示 04/05 的真实样例，而非纯锁屏。", "地图位置为暂定参考点，待现场核实"], ["fwee", 37.5409857, 127.0551593, "读取 03 风格→挑主色与辅助色→设定比例→生成原创情绪色卡（不暗示品牌实际色号）。", "今日情绪调色室", "서울 성동구 성수동2가 309-145", "保存色彩组合即可，不要求试妆。", "付费第一关必须具有明显“动手创造”差异；商家权益仅在完成后、真实合作时选择查看。", "坐标来自品牌官网地图链接"], ["Point of View", 37.5441, 127.0511, "从六类虚拟小物选三件→逐步舍弃两件→留下最珍贵物品→解释理由或用预设句。", "只能留下的一件物品", "서울 성동구 성수동1가 16-39", "完成一件虚拟藏品和一句理由。", "最后结局原样回访该物件；商品素材未经许可不可用于商业宣传。", "地图位置为暂定参考点，待现场核实"], ["手工鞋街", 37.5445, 127.0557, "公共区域观察鞋底/缝线等细节→选择用途解释→读简短工艺知识→与 02 时间词呼应。", "工艺侦探", "서울특별시 성동구 성수동2가", "完成观察+配对；多答案时以解释型反馈代替错误惩罚。", "突出本地性，避免游戏仅剩购物；不要求工坊进入或购买。", "地图位置为暂定参考点，待现场核实"], ["Perment", 37.5474, 127.0435, "系统提供“走累了想休息”等轻情境→组合风味关键词→生成 Taste 卡→产生下一站观察词。", "给今天调一杯味道", "서울 성동구 성수동1가 668-73", "完成两项味觉偏好选择。", "可在合作时附自愿饮品权益，不虚构菜单；地址/业态待核实。", "地图位置为暂定参考点，待现场核实"], ["首尔林", 37.5444, 127.0374, "引用 07 情绪词→在安全步道寻找一种景观感受→写一句话或点词卡→获得 Peace。", "隐藏风景", "서울 성동구 성수동1가 685-20", "一个公共安全空间观察+关键词即可；无需 GPS 精准定位。", "天气恶劣触发数字景观图卡，仍获得碎片，另附收藏图章。", "地图位置为暂定参考点，待现场核实"], ["Warm Ending", 37.5475781, 127.0428383, "玩家完成前八个任务后，可前往推荐晚餐地点享受一天探索后的休息时光→回顾已收集的八块记忆碎片→选择最想保存的三个瞬间→用一句话记录今天的心情→系统根据前序任务中的个人选择生成完整的9/9城市记忆卡、专属称号及圣水洞限定数字印章。", "第九个瞬间", "최가네샤브샤브버섯칼국수（圣水洞晚餐店）서울 성동구 성수동1가 668-99", "完成记忆回顾并领取最终数字成果，即视为通关。不要求实际用餐或消费。", "", "地址坐标已查到"]];
const areas={seongsu:{name:'圣水洞',center:[37.544,127.049],zoom:15},hongdae:{name:'弘大',center:[37.557,126.923],zoom:15},hannam:{name:'汉南洞',center:[37.534,127.002],zoom:15}};
let state={done:[],paid:false,reward:false};try{state={...state,...JSON.parse(localStorage.getItem('sidequest-v22')||'{}')}}catch(e){}let area='seongsu',selected=0,map,layer,markers=[];
const art='url("data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#eadbc4"/><circle cx="230" cy="60" r="40" fill="#d99c6a"/><path d="M0 180 Q80 90 155 165 T300 140 V300 H0Z" fill="#88a18b"/><path d="M40 230V105L125 70 200 105V230Z" fill="#a86f59"/><path d="M65 130h30v40H65z M115 130h30v40h-30z M155 130h25v40h-25z" fill="#f5dfb7"/><path d="M0 250h300v50H0z" fill="#506f5d"/><text x="150" y="280" font-size="23" font-family="sans-serif" text-anchor="middle" fill="white">SEONGSU</text></svg>')+'")';
function save(){try{localStorage.setItem('sidequest-v22',JSON.stringify(state))}catch(e){}}

let view='quest',is3D=true,listOpen=false;const $=id=>document.getElementById(id);
function locked(i){return (i>=3&&(!state.paid||state.done.filter(x=>x<3).length<3))||(i===8&&state.done.filter(x=>x<8).length<8)}
function init(){try{if(!window.maplibregl)throw Error('地图组件未加载');map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[127.049,37.544],zoom:16,pitch:52,bearing:-20,maxPitch:70});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');map.on('load',()=>{
const layers=map.getStyle().layers;
const buildings=layers.filter(l=>l['source-layer']==='building');
const existing=buildings.filter(l=>l.type==='fill-extrusion');
if(!existing.length && buildings.length){const source=buildings[0].source;map.addLayer({id:'sq-buildings',type:'fill-extrusion',source,'source-layer':'building',minzoom:14,paint:{'fill-extrusion-color':'#c4bdd3','fill-extrusion-height':['coalesce',['to-number',['get','render_height'],12],12],'fill-extrusion-base':['coalesce',['to-number',['get','render_min_height'],0],0],'fill-extrusion-opacity':0.85}},layers.find(l=>l.type==='symbol')?.id);}
map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
map.addLayer({id:'route-glow',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#ffffff','line-width':9}});
map.addLayer({id:'route',type:'line',source:'route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#8056cd','line-width':5,'line-dasharray':[2,1]}});
drawMap();overview();
});map.on('error',()=>{$('message').textContent='部分地图资源可能未加载，请检查网络；任务仍可体验。'}); map.on('idle',()=>{if(map.areTilesLoaded()&&$('message').textContent.startsWith('部分地图'))$('message').textContent='';});}catch(e){map=null;$('message').textContent='3D 地图未能启动（需要 WebGL 和联网），任务仍可体验。'}}
function drawMap(){if(!map||!map.getSource('route'))return;markers.forEach(m=>m.remove());markers=[];const coords=tasks.map(t=>[t[2],t[1]]);map.getSource('route').setData({type:'FeatureCollection',features:area==='seongsu'?[{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:coords}}]:[]});if(area!=='seongsu')return;tasks.forEach((t,i)=>{const el=document.createElement('button');el.className='pin '+(state.done.includes(i)?'done':locked(i)?'locked':'')+(i===selected?' active':'');el.textContent=state.done.includes(i)?'✓':i+1;el.title=t[0];el.setAttribute('aria-label',t[0]);el.onclick=e=>{e.stopPropagation();choose(i,false)};markers.push(new maplibregl.Marker({element:el}).setLngLat(coords[i]).addTo(map))})}
function overview(){if(!map)return;if(area==='seongsu'){const b=new maplibregl.LngLatBounds();tasks.forEach(t=>b.extend([t[2],t[1]]));map.fitBounds(b,{padding:65,maxZoom:16.5,pitch:is3D?52:0,bearing:is3D?-20:0,duration:850})}else{const a=areas[area];map.flyTo({center:[a.center[1],a.center[0]],zoom:a.zoom,pitch:is3D?52:0,bearing:is3D?-20:0})}}
function toggle3D(){is3D=!is3D;$('mode').textContent=is3D?'切换 2D':'切换 3D';if(map){for(const l of map.getStyle()?.layers||[]){if(l.type==='fill-extrusion')map.setLayoutProperty(l.id,'visibility',is3D?'visible':'none')}map.easeTo({pitch:is3D?52:0,bearing:is3D?-20:0,duration:700})}}
function choose(i,pan=true){selected=i;view='quest';listOpen=false;render();drawMap();if(map&&pan)map.easeTo({center:[tasks[i][2],tasks[i][1]],duration:650});$('panel').scrollTop=0}
function switchArea(a){area=a;selected=0;view='quest';listOpen=false;drawMap();overview();render();weatherUpdate()}
function showView(v){view=v;render();$('panel').scrollTop=0}
function puzzleHTML(){return `<div class="puzzle">${tasks.map((_,i)=>`<div class="piece ${state.done.includes(i)?'open':''}" style="--pos:${i%3*50}% ${Math.floor(i/3)*50}%;--art:${art.replaceAll('"','&quot;')}">${i+1}</div>`).join('')}</div>`}
function render(){const p=$('content');$('mini').innerHTML=`MY PUZZLE · ${state.done.length}/9<div class="minirow">${tasks.map((_,i)=>`<i class="${state.done.includes(i)?'on':''}"></i>`).join('')}</div>`;document.querySelectorAll('[data-area]').forEach(b=>b.classList.toggle('active',b.dataset.area===area));const progress=`<div class="eyebrow">CHAPTER 01 / SEONGSU</div><h2>圣水探索计划</h2><small>探索进度 ${state.done.length}/9 · 前3站免费</small><div class="progress"><i style="width:${state.done.length/9*100}%"></i></div>`;const freeDone=state.done.filter(x=>x<3).length===3;const unlockHTML=freeDone&&!state.paid?'<div class="mission"><b>免费试玩已完成！</b><p>继续探索剩余6站，拼成完整城市明信片。</p><button class="primary" onclick="unlock()">模拟付费 · 解锁完整路线</button></div>':'';const rewardHTML=state.done.length===9?`<div class="reward"><div class="eyebrow">SEONGSU EXPLORER</div><h3>${state.reward?'✦ 圣水限定数字印章':'完整拼图已集齐！'}</h3>${state.reward?'<p>商家优惠券示例（无实际兑换价值）</p>':'<button class="primary" onclick="claim()">领取最终奖励（模拟）</button>'}</div>`:'';if(view==='profile'){p.innerHTML=`<div class="profilehero"><div class="my-avatar">MY</div><div class="eyebrow" style="color:#eee4ff">MY SIDE QUEST</div><h2>我的探索主页</h2><small>城市探索者 · 本地体验账号</small></div><div class="stats"><div><b>${state.done.length}/9</b>已完成任务</div><div><b>${state.done.length}</b>收集拼图</div><div><b>${state.reward?1:0}</b>数字印章</div></div><h3>我的探索记录</h3>${progress}<div class="mission">${state.done.length?state.done.slice().sort((a,b)=>a-b).map(i=>`<p>✓ ${tasks[i][0]} · ${tasks[i][4]}</p>`).join(''):'还没有探索记录，开启你的第一条城市支线吧！'}</div><h3>我的权益</h3><p>${state.paid?'PLUS 路线已解锁（模拟）':'FREE · 免费体验'}</p>${unlockHTML}${rewardHTML}<div class="profile-actions"><button onclick="showView('puzzle')">我的拼图 / COLLECTION →</button><button class="primary" onclick="switchArea('seongsu')">继续探索 →</button><button onclick="resetDemo()">重置演示进度</button></div><p class="note">个人主页为本地原型，无需登录，记录仅保存在当前浏览器。</p>`;return}if(view==='puzzle'){p.innerHTML=progress+`<h3>我的拼图 / COLLECTION</h3>${puzzleHTML()}${unlockHTML}${rewardHTML}<button onclick="showView('quest')">返回探索</button><p class="note">示例拼图 · 进度保存在当前浏览器。</p><button onclick="resetDemo()">重置演示</button>`;return}if(area!=='seongsu'){p.innerHTML=`<div class="eyebrow">FUTURE CHAPTER</div><h2>${areas[area].name}</h2><div class="hero"><strong>SOON</strong><span>NEW QUEST</span></div><p>路线筹备中，敬请期待。</p><button class="primary" onclick="switchArea('seongsu')">返回圣水试点</button>`;return}const t=tasks[selected],done=state.done.includes(selected);p.innerHTML=progress+`<details ${listOpen?'open':''} id="tasklist"><summary>全部任务 · 9 站</summary>${tasks.map((x,i)=>`<button class="task ${i===selected?'active':''}" onclick="choose(${i})"><span class="num">${i+1}</span>${x[0]}<span class="status">${state.done.includes(i)?'✓':i<3?'FREE':locked(i)?'LOCK':'OPEN'}</span></button>`).join('')}</details><div class="hero"><strong>0${selected+1}</strong><span>${done?'COMPLETED':locked(selected)?'LOCKED':selected<3?'FREE QUEST':'SIDE QUEST'}</span></div><div class="detail"><div class="eyebrow">QUEST 0${selected+1} · 约60分钟（示例）</div><h2>${t[0]} · ${t[4]}</h2><p class="note">${t[5]}<br>${t[8]}</p>${locked(selected)?`<p>${selected===8?'完成前八站后解锁结局。':'完成前三站并模拟付费后，解锁进阶任务。'}</p>${selected===3||selected===4?'<p class="mission">PLUS 预览：'+t[3]+'</p>':''}`:`<div class="section">STORY / 故事线索</div><p>${t[4]}</p><div class="section">MISSION / 探索任务</div><p class="mission">${t[3]}</p><div class="section">完成条件</div><p>${t[6]}</p><div class="section">联动提示</div><p class="note">${t[7]}</p>${selected===7?'<p id="rainNote" class="mission" hidden>天气不佳时，可在安全室内通过数字景观图卡完成观察。</p>':''}`}<button class="primary" ${done||locked(selected)?'disabled':''} onclick="checkin()">${done?'已完成 ✓':locked(selected)?'进阶任务未解锁':'模拟打卡 · 收集拼图'}</button></div>${unlockHTML}${rewardHTML}<button onclick="choose(${(selected+1)%9})">下一站 →</button> <button onclick="showView('puzzle')">查看拼图</button><p class="note">课堂原型 · 任务依据企划文档；部分坐标为待核实参考点；虚线仅表示探索顺序，非步行导航。3D 建筑来自 OpenStreetMap 建筑轮廓与高度数据，缺失高度可能为估算值。未接入定位或支付；任务流程为文字展示，打卡为模拟。</p>`;$('tasklist').ontoggle=()=>{listOpen=$('tasklist')?.open||false};updateRain()}
function checkin(){if(locked(selected)||state.done.includes(selected))return;const i=selected;state.done.push(i);save();drawMap();render();celebrate(i)}
function unlock(){if(state.done.filter(x=>x<3).length!==3)return;state.paid=true;save();drawMap();render()}
function claim(){if(state.done.length===9){state.reward=true;save();render()}}
function resetDemo(){if(confirm('清除当前演示进度？')){state={done:[],paid:false,reward:false};save();drawMap();render()}}

let weatherSeq=0, weatherCode=null;
function weatherText(c){return c===0?['☀️','晴']:c<=2?['⛅','多云']:c===3?['☁️','阴']:c<=48?['🌫️','雾']:c>=95?['⛈️','雷雨']:c>=71&&c<=77||c>=85?['❄️','降雪']:['🌧️','降雨']}
async function weatherUpdate(){const a=areas[area],seq=++weatherSeq,w=$('weather');weatherCode=null;w.innerHTML='<p>'+a.name+' · 正在获取天气…</p>';try{const url=new URL('https://api.open-meteo.com/v1/forecast');url.search=new URLSearchParams({latitude:a.center[0],longitude:a.center[1],current:'temperature_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation,is_day',timezone:'Asia/Seoul'});const r=await fetch(url,{signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('weather');const {current:c}=await r.json();if(seq!==weatherSeq)return;weatherCode=c.weather_code;const [ico,label]=weatherText(c.weather_code);w.innerHTML=`<div class="weatherline"><span>${c.is_day===0&&c.weather_code===0?'🌙':ico}</span><strong>${Math.round(c.temperature_2m)}°C</strong><b>${label}</b></div><div class="wxmeta"><small>${a.name} · 体感 ${Math.round(c.apparent_temperature)}°C</small><div class="weatherfoot">${c.time.slice(11)} · <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></div></div><button onclick="weatherUpdate()" aria-label="刷新天气" title="风速 ${c.wind_speed_10m} km/h · 韩国时间 ${c.time}">↻</button>`;updateRain()}catch(e){if(seq===weatherSeq)w.innerHTML='<p>'+a.name+' · 天气暂不可用</p><button onclick="weatherUpdate()">重试</button>'}}
function updateRain(){const e=$('rainNote');if(e)e.hidden=!(weatherCode!==null&&weatherCode>=51)}
let audio;function playChime(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=audio||new A();audio.resume().catch(()=>{});const now=audio.currentTime;[659.25,783.99,987.77,1318.51].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=now+i*.085;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.001,t);g.gain.exponentialRampToValueAtTime(.12,t+.018);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.26)})}catch(e){}}
function celebrate(i){playChime();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const el=markers[i]?.getElement();if(!el)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;const canvas=$('fireworks'),ctx=canvas.getContext('2d'),d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.scale(d,d);const colors=['#ff6b9d','#ffd166','#8c65e8','#54d8c3','#64a7ff','#ff975c'];const particles=Array.from({length:54},(_,j)=>{const angle=j*2*Math.PI/54+Math.random()*.3,v=55+Math.random()*115;return {vx:Math.cos(angle)*v,vy:Math.sin(angle)*v,c:colors[j%colors.length],r:2+Math.random()*3}});const start=performance.now();function frame(now){const t=(now-start)/1000;ctx.clearRect(0,0,innerWidth,innerHeight);if(t>1.15)return;for(const p of particles){ctx.globalAlpha=Math.max(0,1-t/1.15);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(x+p.vx*t,y+p.vy*t+65*t*t,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame)}

document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{switchArea(b.dataset.area);document.getElementById('message').textContent=''});function search(){let s=document.getElementById('search').value.trim().toLowerCase();let a=/圣水|聖水|성수|seongsu/.test(s)?'seongsu':/弘大|홍대|hongdae/.test(s)?'hongdae':/汉南|漢南|한남|hannam/.test(s)?'hannam':null;if(a){switchArea(a);document.getElementById('message').textContent=''}else document.getElementById('message').textContent='目前支持圣水洞、弘大、汉南洞。'}document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();search()};document.getElementById('search').onchange=search;init();render();weatherUpdate();setInterval(weatherUpdate,600000);
</script></body></html>
